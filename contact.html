    <style>
      /* all over styling */
body {
  background-color: #DAE7F6;
  font-family: "Montserrat", sans-serif;
  font-optical-sizing: auto;
  font-style: normal;
}


/* Navigation Bar */
.navbar{
  padding: 10px 0;
}


.nav-links{
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  justify-content: center;
}


.nav-links li {
  margin: 0 15px;
}


.nav-links a {
  text-decoration: none;
  color: black;
  font-size: 18px;
  padding: 10px;
  transition: text-decoration 0.3s ease-in-out;
}


.nav-links a:hover {
  opacity: 0.5;
  border-radius: 5px;
  text-decoration: underline;
}


/* Info Box Below Navbar */
.contact-box {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 20px;
  max-width: 900px;
  margin: auto;
  border: 2px solid #333;  /* Outline the box */
  border-radius: 10px;
  box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
}
</style>

   <!--Navigation bar to get between the multiple pages-->
    <nav class="navbar">
    <ul class="nav-links">

    </ul>
   </nav>
